<div class="app">
  <!-- 顶部店铺信息 -->
  <div class="header">
    <h1>Li jie的奶茶铺 🧋</h1>
    <p>营业中 · 手机点单免排队</p>
  </div>

  <!-- 商品列表 -->
  <div class="menu-list">
    <div class="item">
      <div class="info">
        <h3>珍珠奶茶</h3>
        <p>经典口味，Q弹珍珠</p>
        <span class="price">¥15</span>
      </div>
      <button class="add-btn" onclick="addToCart('珍珠奶茶', 15)">+</button>
    </div>

    <div class="item">
      <div class="info">
        <h3>草莓芝士</h3>
        <p>新鲜草莓，浓郁芝士</p>
        <span class="price">¥18</span>
      </div>
      <button class="add-btn" onclick="addToCart('草莓芝士', 18)">+</button>
    </div>

    <div class="item">
      <div class="info">
        <h3>手打柠檬茶</h3>
        <p>清爽解腻，夏日首选</p>
        <span class="price">¥12</span>
      </div>
      <button class="add-btn" onclick="addToCart('手打柠檬茶', 12)">+</button>
    </div>
  </div>

  <!-- 底部购物车 -->
  <div class="footer">
    <div class="cart-info">
      <span>购物车：<b id="count">0</b> 件</span>
      <span>合计：<b id="total">0</b> 元</span>
    </div>
    <button class="checkout-btn" onclick="checkout()">去结算</button>
  </div>
</div>

<style>
body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
.app { max-width: 400px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
.header { background: #0a7; color: white; padding: 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
.header h1 { margin: 0 0 5px 0; font-size: 20px; }
.header p { margin: 0; font-size: 12px; opacity: 0.8; }
.menu-list { padding: 15px; flex: 1; }
.item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid #0a7; }
.info h3 { margin: 0 0 5px 0; font-size: 16px; color: #333; }
.info p { margin: 0 0 5px 0; font-size: 12px; color: #888; }
.price { color: #e74c3c; font-weight: bold; font-size: 15px; }
.add-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: #0a7; color: white; font-size: 20px; font-weight: bold; line-height: 1; cursor: pointer; }
.add-btn:active { transform: scale(0.9); }
.footer { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: white; border-top: 1px solid #eee; position: sticky; bottom: 0; }
.cart-info { display: flex; flex-direction: column; font-size: 14px; color: #333; gap: 4px; }
.cart-info b { color: #e74c3c; font-size: 16px; }
.checkout-btn { padding: 10px 25px; border: none; background: #0a7; color: white; border-radius: 20px; font-size: 15px; font-weight: bold; cursor: pointer; }
.checkout-btn:active { background: #085; }
</style>

<script>
let cartCount = 0;
let cartTotal = 0;

function addToCart(name, price) {
  cartCount++;
  cartTotal += price;
  document.getElementById('count').innerText = cartCount;
  document.getElementById('total').innerText = cartTotal;
  alert('已加入购物车：' + name);
}

function checkout() {
  if (cartCount === 0) {
    alert('购物车还是空的哦！');
    return;
  }
  alert('结算功能需要后台支持，这是前端演示 Demo！');
}
</script>
